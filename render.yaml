# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# The database is external (Neon free tier); paste its connection details when Render asks for them.
services:
  - type: web
    name: hat-lanh
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/categories
    autoDeploy: true
    envVars:
      # Neon: jdbc:postgresql://<host>/<database>?sslmode=require  (host looks like ep-xxx.ap-southeast-1.aws.neon.tech)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Random secret generated by Render, never stored in git
      - key: JWT_SECRET
        generateValue: true
      # The public URL of this service, e.g. https://hat-lanh.onrender.com (CORS allows only this origin)
      - key: FRONTEND_URL
        sync: false
      # Frontend and API share one origin, so Lax cookies work
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: COOKIE_SECURE
        value: "true"
      # Render terminates TLS in a proxy: trust X-Forwarded-For so rate limits see the real client IP
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      # Cloudflare TEST secret (always passes = no real bot protection). Replace with your own Turnstile keys
      # (and VITE_TURNSTILE_SITE_KEY) before taking real customers.
      - key: TURNSTILE_SECRET_KEY
        value: 1x0000000000000000000000000000000AA
      # Empty = password-reset emails are only written to the Render logs
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
