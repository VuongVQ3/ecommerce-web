# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# The database is external (Neon free tier); paste its connection details when Render asks for them.
services:
  - type: web
    name: hat-lanh
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon: jdbc:postgresql://<host>/<database>?sslmode=require  (host looks like ep-xxx.ap-southeast-1.aws.neon.tech)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Random secret generated by Render, never stored in git
      - key: JWT_SECRET
        generateValue: true
      # The public URL of this service, e.g. https://hat-lanh.onrender.com (CORS allows only this origin)
      - key: FRONTEND_URL
        sync: false
      # Frontend and API share one origin, so Lax cookies work
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: COOKIE_SECURE
        value: "true"
      # Render terminates TLS in a proxy: trust X-Forwarded-For so rate limits see the real client IP
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      # Cloudflare TEST secret (always passes = no real bot protection). Replace with your own Turnstile keys
      # (and VITE_TURNSTILE_SITE_KEY) before taking real customers.
      - key: TURNSTILE_SECRET_KEY
        value: 1x0000000000000000000000000000000AA
      # Empty = password-reset emails are only written to the Render logs
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Telegram alerts to the shop (new order, customer cancelled); either one empty = off
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Public base URL for canonical links, Open Graph and the sitemap (falls back to FRONTEND_URL).
      # Set it when moving to a custom domain, e.g. https://hatlanh.vn
      - key: SITE_URL
        sync: false
      # Business details for the footer and /lien-he; leave empty to hide a field
      - key: BUSINESS_OWNER_NAME
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_REGISTRATION_NUMBER
        sync: false
      - key: BUSINESS_HOTLINE
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_MOIT_URL
        sync: false
      # Floating contact button: Zalo number and Facebook page username/id (empty = channel hidden)
      - key: ZALO_PHONE
        sync: false
      - key: MESSENGER_PAGE
        sync: false
      # Footer icons: https links to the shop's Facebook, Shopee and TikTok pages
      - key: FACEBOOK_URL
        sync: false
      - key: SHOPEE_URL
        sync: false
      - key: TIKTOK_URL
        sync: false
