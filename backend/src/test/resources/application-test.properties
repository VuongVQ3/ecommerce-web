# The datasource comes from Testcontainers (see TestcontainersConfiguration).
app.jwt.secret=test-only-secret-not-used-anywhere-else-0123456789
app.frontend-url=http://localhost:5173
app.cookie.same-site=Lax
app.cookie.secure=true
app.google.client-id=
# Cloudflare's test secret. The siteverify call is stubbed in tests (StubTurnstileConfig), so no network is used.
app.turnstile.secret-key=1x0000000000000000000000000000000AA

# Fixed base URL so canonical/sitemap assertions do not depend on the developer's .env
app.site.url=http://localhost:8080
# Never message the real chat from tests, whatever the developer's .env holds
app.telegram.bot-token=
app.telegram.chat-id=
# Never call real third-party services from tests, whatever the developer's .env holds.
# Empty Resend key selects LoggingEmailSender; CapturingEmailSender replaces it where a test needs the message.
app.mail.resend-api-key=
app.cloudinary-url=
# Tests run without a Resend key; allow the log-only sender (production requires the key and fails fast without it).
app.mail.allow-logging-sender=true

# Abuse controls are relaxed for tests so orders sharing a phone do not trip the cap; a dedicated test overrides it.
app.orders.max-open-pending-per-phone=1000
