spring.application.name=backend

# Local settings and secrets live in backend/.env (git-ignored, see .env.example).
# Real environment variables take precedence over values in that file.
spring.config.import=optional:file:./.env[.properties]

# Hosting platforms (e.g. Render) pass the port to listen on in PORT.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutshop}
# Small pool: free Postgres tiers (e.g. Neon) allow few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.username=${DB_USERNAME:nutshop}
spring.datasource.password=${DB_PASSWORD:nutshop}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Use "framework" only when running behind a trusted reverse proxy, otherwise clients could
# spoof X-Forwarded-For to dodge IP rate limits.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# No default on purpose: the app refuses to start without a secret (min. 32 characters).
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Production with frontend and backend on different sites: COOKIE_SAME_SITE=None (requires Secure).
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.secure=${COOKIE_SECURE:true}

# Per client IP, for POST /api/auth/login, /register, /forgot-password, /reset-password (each counted separately).
app.rate-limit.auth.max-requests=5
app.rate-limit.auth.window=PT1M
# Per client IP, for the public guest-cart endpoint POST /api/cart/validate.
app.rate-limit.cart-validate.max-requests=60
app.rate-limit.cart-validate.window=PT1M
# Per client IP: placing orders (each order reserves stock) and guest order lookup.
app.rate-limit.order-create.max-requests=5
app.rate-limit.order-create.window=PT10M
app.rate-limit.order-lookup.max-requests=10
app.rate-limit.order-lookup.window=PT10M
# Per email address, for POST /api/auth/forgot-password.
app.rate-limit.password-reset.max-requests=3
app.rate-limit.password-reset.window=PT15M
# Guest tracking links (per IP), creating an account from one, attaching recent orders after sign-in
app.rate-limit.order-track.max-requests=30
app.rate-limit.order-track.window=PT1M
app.rate-limit.claim-account.max-requests=5
app.rate-limit.claim-account.window=PT15M
app.rate-limit.order-claim.max-requests=10
app.rate-limit.order-claim.window=PT1M
# Opening verification links (per IP) and asking for a new one (per account)
app.rate-limit.verify-email.max-requests=10
app.rate-limit.verify-email.window=PT10M
app.rate-limit.verification-email.max-requests=3
app.rate-limit.verification-email.window=PT15M

app.password-reset.ttl=PT30M

# Cart. Amounts in VND (whole dong).
cart.max-qty-per-item=10
cart.free-shipping-threshold=500000
cart.shipping-fee=30000

# Transactional email via Resend. Empty key = emails are written to the log instead (development only).
app.mail.resend-api-key=${RESEND_API_KEY:}
# Must be on a domain verified in Resend. onboarding@resend.dev only delivers to your own Resend account email.
app.mail.from=${MAIL_FROM:Hat Lanh <onboarding@resend.dev>}

# Cloudflare Turnstile secret for registration. Required. Locally/in tests use Cloudflare's always-pass test
# secret 1x0000000000000000000000000000000AA (still calls Cloudflare, so it needs internet access).
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY}

# OAuth client ID from Google Cloud Console. Leave empty to disable "Sign in with Google".
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Back office. ADMIN_EMAIL: an existing account promoted to ADMIN at startup (no password is ever configured here).
app.admin-email=${ADMIN_EMAIL:}
# cloudinary://<api_key>:<api_secret>@<cloud_name> from the Cloudinary console. Empty = image uploads disabled.
app.cloudinary-url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Public base URL for canonical links, Open Graph, robots.txt and the sitemap. Defaults to FRONTEND_URL.
app.site.url=${SITE_URL:${FRONTEND_URL:http://localhost:8080}}
# Business details shown in the footer and on /lien-he. Empty = hidden (never shown as sample values).
app.site.business.owner-name=${BUSINESS_OWNER_NAME:}
app.site.business.address=${BUSINESS_ADDRESS:}
app.site.business.registration-number=${BUSINESS_REGISTRATION_NUMBER:}
app.site.business.hotline=${BUSINESS_HOTLINE:}
app.site.business.email=${BUSINESS_EMAIL:}
# Link to the shop's notification on online.gov.vn (Bộ Công Thương); must start with https://
app.site.business.moit-url=${BUSINESS_MOIT_URL:}

# gzip for API/HTML responses (bundles are pre-compressed to .br/.gz at build time)
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=text/html,text/plain,text/css,text/xml,application/xml,application/json,application/problem+json,application/javascript,text/javascript,image/svg+xml

# Sale prices (see docs/pricing.md). Check the promotion regulations in force before changing them.
promotion.max-discount-percent=50
promotion.max-days-per-year=120
